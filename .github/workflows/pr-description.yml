name: PR description

# Fills the "Changes" block of a pull request (between the auto:start and auto:end markers
# of the template) with the commits and changed files. Text outside the block is never touched.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    # Pull requests from forks get a read-only token, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fill the automatic block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only SHAs and the PR number go through the environment; commit subjects and file
        # names are read from git by the script, never pasted into a command.
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > body.md
          bash .github/scripts/pr-description.sh "$BASE_SHA" "$HEAD_SHA" body.md > new-body.md
          if cmp -s body.md new-body.md; then
            echo "Description already up to date."
          else
            gh pr edit "$PR_NUMBER" --body-file new-body.md
          fi
